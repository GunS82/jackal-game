# Клиент «Шакала» на GitHub Pages: статические файлы, без сборки.
# URL Cloudflare Worker берётся из переменной репозитория SERVER_URL (Settings → Secrets and variables → Actions → Variables).
name: Deploy client to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Собрать сайт
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: |
          npm run build:web
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
