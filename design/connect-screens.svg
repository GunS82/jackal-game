" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#5a3b1e">Связь потеряна</text><text x="100" y="287" font-family="DejaVu Sans" font-size="13" fill="#5a3b1e">Переподключаемся… 3 c</text><rect x="32" y="325" width="296" height="88" rx="12" fill="#f2b8a8" stroke="#5a3b1e" stroke-width="3"/><text x="56" y="377" font-size="30" font-family="DejaVu Sans" font-weight="bold" fill="#5a3b1e">×</text><text x="100" y="363" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#5a3b1e">Соперник вышел</text><text x="100" y="387" font-family="DejaVu Sans" font-size="13" fill="#5a3b1e">Ждать 2 мин · Завершить</text><rect x="32" y="425" width="296" height="88" rx="12" fill="#cfe6b8" stroke="#5a3b1e" stroke-width="3"/><text x="56" y="477" font-size="30" font-family="DejaVu Sans" font-weight="bold" fill="#5a3b1e">★</text><text x="100" y="463" font-family="DejaVu Sans" font-size="17" font-weight="bold" fill="#5a3b1e">Ваш ход!</text><text x="100" y="487" font-family="DejaVu Sans" font-size="13" fill="#5a3b1e">Вибрация и звук колокола</text><text x="180" y="560" font-family="DejaVu Sans" font-size="13" font-weight="normal" text-anchor="middle" fill="#5a3b1e">Поле при этом остаётся видно,</text><text x="180" y="580" font-family="DejaVu Sans" font-size="13" font-weight="normal" text-anchor="middle" fill="#5a3b1e">плашка не закрывает игру</text></g></svg>